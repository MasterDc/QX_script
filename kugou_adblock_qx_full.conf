# Kugou/TME (酷狗/腾讯音乐) 广告屏蔽规则 - QuanX 3.0+
# 基于 HAR 流量分析生成
#
# 使用方法:
#   1. 打开 QuanX > 设置 > 订阅 > 添加规则列表
#   2. 或直接粘贴到 rewrite.conf / filter.conf 中
#
# 生效广告类型: 启动页、弹窗、Banner、信息流、视频广告、SDK上报

[rewrite_remote]
# 酷狗/TME 广告屏蔽 (本地规则)
https://raw.githubusercontent.com/... , tag=kugou_adblock, enabled=true

[filter_remote]
# 同 filter_remote 用法，如需 separate filter 可启用

[filter]
# ============ 酷狗网关广告接口 ============
# 启动页广告接口
^(https?://)?gateway\.kugou\.com/ads\.service/.* rewrites=no-body
^(https?://)?gateway\.kugou\.com/ads\.gateway/.* rewrites=no-body

# ============ TME 广告 SDK ============
# 腾讯音乐广告代理
^https?://ad\.tencentmusic\.com/.* rewrites=no-body
^https?://tmeadcomm\.y\.qq\.com/.* rewrites=no-body
^https?://tmead\.y\.qq\.com/.* rewrites=no-body

# ============ 广点通广告 ============
# 广告视频/图片 CDN
^https?://adsmind\.gdtimg\.com/.* rewrites=no-body
^https?://pgdt\.gtimg\.cn/.* rewrites=no-body
# 广点通统计/上报
^https?://rpt\.gdt\.qq\.com/.* rewrites=no-body
^https?://v\.gdt\.qq\.com/.* rewrites=no-body
# 广点通样式模板
^https?://xs\.gdt\.qq\.com/.* rewrites=no-body
^https?://xsweb\.gdt\.qq\.com/.* rewrites=no-body
# 腾讯广告追踪
^https?://tangram\.e\.qq\.com/.* rewrites=no-body

# ============ 酷狗 CDN 广告素材 ============
# 启动页图片
^https?://amsweb-cdn-gz-1258344696\.file\.myqcloud\.com/.* rewrites=no-body
# 广告按钮/图片素材
^https?://mdpfilebssdlbig\.kugou\.com/.* rewrites=no-body

# ============ 苹果广告归因 ============
^https?://ca\.iadsdk\.apple\.com/.* rewrites=no-body
^https?://api-adservices\.apple\.com/.* rewrites=no-body

# ============ 腾讯广告追踪子域名 ============
^https?://p\.l\.qq\.com/.* rewrites=no-body
^https?://us\.l\.qq\.com/.* rewrites=no-body

[hostname]
# MITM 主机名白名单 (需配合 rewrite 使用)
^gateway\.kugou\.com$ = opt-ssl-server
^ad\.tencentmusic\.com$ = opt-ssl-server
^tmeadcomm\.y\.qq\.com$ = opt-ssl-server
^tmead\.y\.qq\.com$ = opt-ssl-server
^adsmind\.gdtimg\.com$ = opt-ssl-server
^pgdt\.gtimg\.cn$ = opt-ssl-server
^rpt\.gdt\.qq\.com$ = opt-ssl-server
^v\.gdt\.qq\.com$ = opt-ssl-server
^xs\.gdt\.qq\.com$ = opt-ssl-server
^xsweb\.gdt\.qq\.com$ = opt-ssl-server
^tangram\.e\.qq\.com$ = opt-ssl-server
^amsweb-cdn-gz-1258344696\.file\.myqcloud\.com$ = opt-ssl-server
^mdpfilebssdlbig\.kugou\.com$ = opt-ssl-server
^ca\.iadsdk\.apple\.com$ = opt-ssl-server
^api-adservices\.apple\.com$ = opt-ssl-server
^p\.l\.qq\.com$ = opt-ssl-server
^us\.l\.qq\.com$ = opt-ssl-server
