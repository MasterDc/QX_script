# Kugou/TME (酷狗/腾讯音乐) 广告屏蔽 - Quantumult X
# 基于 HAR 流量分析 | 2026-08-06
# 导入: QuanX > 设置 > 分流 > 规则资源 (filter) + 重写 > 规则资源 (rewrite)
# 注意: MITM 部分需手动粘贴到主配置 [mitm] 段落

# ============================================================
# [filter_local] 分流规则
# 用法: 直接粘贴到 QuanX 的 filter_local 配置文件
# 或作为 .list 文件导入
# ============================================================

# --- 独立广告域名 (整域拒绝) ---
host-suffix, ad.tencentmusic.com, reject
host-suffix, tmeadcomm.y.qq.com, reject
host-suffix, tmead.y.qq.com, reject
host-suffix, adsmind.gdtimg.com, reject
host-suffix, pgdt.gtimg.cn, reject
host-suffix, rpt.gdt.qq.com, reject
host-suffix, v.gdt.qq.com, reject
host-suffix, xs.gdt.qq.com, reject
host-suffix, xsweb.gdt.qq.com, reject
host-suffix, tangram.e.qq.com, reject
host-suffix, amsweb-cdn-gz-1258344696.file.myqcloud.com, reject
host-suffix, mdpfilebssdlbig.kugou.com, reject
host-suffix, ca.iadsdk.apple.com, reject
host-suffix, api-adservices.apple.com, reject
host-suffix, p.l.qq.com, reject
host-suffix, us.l.qq.com, reject

# ============================================================
# [rewrite_local] 重写规则 (需配合 MITM)
# 针对共用域名 gateway.kugou.com，只拦截广告路径
# 用法: 粘贴到 QuanX 的 rewrite_local 配置文件
# ============================================================

# 启动页广告
^https?://gateway\.kugou\.com/ads\.service/v2/lite_v_splash url reject-200
# 弹窗广告 (popup)
^https?://gateway\.kugou\.com/ads\.gateway/v2/lite_v_popup url reject-200
# 首页 Banner
^https?://gateway\.kugou\.com/ads\.gateway/v2/lite_v_youth_home_banner url reject-200
# 搜索无焦点广告
^https?://gateway\.kugou\.com/ads\.gateway/v2/lite_v_search_no_focus url reject-200
# 播放器组件广告
^https?://gateway\.kugou\.com/ads\.gateway/v2/lite_v_youth_player_widget url reject-200
# VIP中心广告
^https?://gateway\.kugou\.com/ads\.gateway/v2/lite_v_vip_center url reject-200
# 广告曝光上报
^https?://gateway\.kugou\.com/ads\.gateway/v3/stat_expose url reject-200
# 酷狗广告服务 (通用兜底)
^https?://gateway\.kugou\.com/ads\. url reject-200

# 广告素材 CDN — 图片按钮 (在酷狗主域下的广告图片)
^https?://mdpfilebssdlbig\.kugou\.com/.*\.(png|jpg|jpeg|webp) url reject-img

# 广告配置接口 (返回空 JSON 以欺骗后端无需加载广告)
^https?://adservice\.kugou\.com/v2/lite_v_youth_task_center url reject-200
^https?://adservice\.kugou\.com/v2/lite_v_youth_player_widget url reject-200

# ============================================================
# [mitm] MITM 主机名
# 用法: 粘贴到 QuanX 主配置文件的 [mitm] 段 hostname = 后面
# 格式: hostname = gateway.kugou.com, adservice.kugou.com
# 注意: 仅 gateway.kugou.com 和 adservice.kugou.com 需要 MITM
#       (独立广告域名已在 filter 中全局 reject，无需 MITM)
# ============================================================
# hostname = gateway.kugou.com, adservice.kugou.com, mdpfilebssdlbig.kugou.com
