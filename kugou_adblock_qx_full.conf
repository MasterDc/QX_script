【第 1 段】分流规则
粘贴位置：圈X 配置文件 [filter_local] 段
或另存为 kugou_ads.list 后，在「分流 → 规则资源」里添加
注意：必须放在 [filter_local] 最前面，前面不能有 ip-cidr / final
------------------------------------------------------------
host, adservice.kugou.com, reject
host, tmeadcomm.y.qq.com, reject
host-suffix, ad.tencentmusic.com, reject
host-suffix, us.l.qq.com, reject
host-suffix, p.l.qq.com, reject
host-suffix, v.gdt.qq.com, reject
host-suffix, rpt.gdt.qq.com, reject
host-suffix, xs.gdt.qq.com, reject
host-suffix, xsweb.gdt.qq.com, reject
host-suffix, tangram.e.qq.com, reject
host-suffix, pgdt.gtimg.cn, reject
host-suffix, adsmind.gdtimg.com, reject
host-suffix, tmead.y.qq.com, reject
host-suffix, amsweb-cdn-gz-1258344696.file.myqcloud.com, reject


【第 2 段】重写规则
粘贴位置：圈X 配置文件 [rewrite_local] 段
作用：封掉 gateway.kugou.com 上的全部广告路径（酷狗自有开屏/搜索/VIP/播放器广告）
------------------------------------------------------------
^https?:\/\/gateway\.kugou\.com\/ads\. url reject-dict


【第 3 段】MITM
粘贴位置：圈X 配置文件 [mitm] 段的 hostname 后面
写法：hostname = %APPEND% gateway.kugou.com
注意：不能带 # 号，带 # 就整段失效
------------------------------------------------------------
gateway.kugou.com


============================================================
可选：埋点上报（不是广告，拦了省流量，不影响功能）
------------------------------------------------------------
host-suffix, nbcollect.kugou.com, reject
host-suffix, webcollects.kugou.com, reject
host-suffix, jswebcollects.kugou.com, reject
============================================================


============================================================
生效检查清单（漏一步 = 全部白配）
------------------------------------------------------------
1. [mitm] 的 hostname 行前面没有 #
2. 圈X → 设置 → 证书 → 已生成并安装
3. iOS 设置 → 通用 → 关于本机 → 证书信任设置 → 打开圈X证书开关
4. 改完点「重载配置」，不是「刷新」
5. 分流规则在 [filter_local] 段最前面
============================================================


